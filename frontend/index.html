<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADOO - ฟีดข่าว & แผนที่นำทางท่องเที่ยว 🗺️</title>
<!-- Leaflet.js CSS (Free, OpenStreetMap Map Library) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <a href="index.html" class="nav-brand">✨ MADOO</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link active">🏠 ฟีด</a>
    <a href="search.html" class="nav-link">🔍 ค้นหา</a>
    <a href="profile.html" id="myProfileLink" class="nav-link">👤 โปรไฟล์</a>
    <button class="btn-logout" onclick="logout()">🚪 ออกจากระบบ</button>
  </div>
</div>

<div class="container">

  <!-- แผนที่แบบโต้ตอบแสดงหมุดสถานที่ (Leaflet + OpenStreetMap) -->
  <div class="card map-container-card">
    <div class="map-header-title">
      <span>🗺️ แผนที่พิกัดสถานที่ท่องเที่ยว (Pins on Map)</span>
      <span style="font-size:12px; color:var(--accent-cyan); font-weight:normal;">คลิกที่ปักหมุดเพื่อดูข้อมูลและกดนำทาง</span>
    </div>
    <div id="mainMap"></div>
  </div>

  <!-- กล่องโพสต์เรื่องราวท่องเที่ยว -->
  <div class="card post-form">
    <div class="post-header">
      <div class="post-header-left">
        <img id="myAvatar" class="avatar" src="" alt="Avatar">
        <div>
          <strong id="myUsername" style="font-size:16px; font-weight:700; color:var(--text-main);"></strong>
          <div style="font-size:12px; color:var(--accent-cyan); font-weight:600; display:flex; align-items:center; gap:4px; margin-top:2px;">
            <span>🌐 สาธารณะ</span> · <span style="color:var(--accent-pink);">⚡ Live Feed</span>
          </div>
        </div>
      </div>
    </div>

    <textarea id="postContent" placeholder="แบ่งปันสถานที่ท่องเที่ยว ความรู้สึก หรือคำแนะนำดีๆ..."></textarea>

    <!-- ตัวเลือกสถานที่/ปักหมุดพิกัดนำทาง -->
    <div class="location-picker-box">
      <div class="location-picker-header">
        <span style="font-size:13px; font-weight:700; color:var(--text-sub);">📍 ระบุสถานที่ & พิกัดนำทาง GPS</span>
        <button type="button" id="getGpsBtn" class="btn-gps">📡 ใช้ตำแหน่งปัจจุบันของฉัน</button>
      </div>

      <div style="margin-top:8px;">
        <select id="presetLocationSelect" class="location-input-field" style="width:100%; margin-bottom:8px;">
          <option value="">-- เลือกสถานที่ท่องเที่ยวแนะนำ (หรือกรอกเองด้านล่าง) --</option>
          <option value="วัดสิรินธรวรารามภูพร้าว (วัดเรืองแสง), อุบลราชธานี|15.2286|104.8563">🛕 วัดสิรินธรวรารามภูพร้าว (วัดเรืองแสง), อุบลราชธานี</option>
          <option value="ประตูท่าแพ, เชียงใหม่|18.7877|98.9931">🏔️ ประตูท่าแพ, เชียงใหม่</option>
          <option value="แหลมพรหมเทพ, ภูเก็ต|7.7607|98.3054">🌅 แหลมพรหมเทพ, ภูเก็ต</option>
          <option value="วัดพระศรีรัตนศาสดาราม (วัดพระแก้ว), กรุงเทพฯ|13.7516|100.4927">🏰 วัดพระแก้ว, กรุงเทพมหานคร</option>
          <option value="อุทยานแห่งชาติเขาใหญ่, นครราชสีมา|14.4390|101.3724">🌿 อุทยานแห่งชาติเขาใหญ่, นครราชสีมา</option>
        </select>
      </div>

      <div class="location-picker-row">
        <input type="text" id="locationNameInput" class="location-input-field location-name-input" placeholder="ชื่อสถานที่ (เช่น วัดเรืองแสง อุบลฯ)">
        <input type="number" step="any" id="latInput" class="location-input-field location-coord-input" placeholder="Latitude">
        <input type="number" step="any" id="lngInput" class="location-input-field location-coord-input" placeholder="Longitude">
      </div>
    </div>

    <!-- พรีวิวรูปภาพที่เลือก -->
    <div id="imagePreviewContainer" style="display:none; position:relative; margin-top:12px;">
      <img id="imagePreview" style="max-width:100%; max-height:340px; border-radius:12px; display:block; border: 1px solid var(--card-border); box-shadow:0 8px 24px rgba(0,0,0,0.3);">
      <button type="button" id="removeImageBtn" title="ลบรูปภาพ">✕</button>
    </div>

    <div class="form-actions">
      <button type="button" id="attachImageBtn" class="file-label">
        🖼️ เพิ่มรูปภาพ
      </button>
      <input type="file" id="postImage" accept="image/*" style="display:none">
      <button class="btn btn-primary" id="submitPostBtn">✨ โพสต์เลย</button>
    </div>
    <div id="postError" class="error-msg" style="display:none; margin-top:10px;"></div>
  </div>

  <!-- แถบกรอง/เรียงตามระยะทาง GPS -->
  <div class="filter-toolbar">
    <div class="filter-group">
      <span>📍 ตำแหน่งปัจจุบันของคุณ:</span>
      <span id="userLocationStatus" style="color:var(--accent-cyan); font-weight:600;">ยังไม่ได้ระบุ GPS</span>
      <button type="button" id="calcDistanceBtn" class="btn-gps" style="padding:4px 10px; font-size:12px;">📡 หาตำแหน่งของฉัน</button>
    </div>

    <div class="filter-group">
      <span>เรียงลำดับ:</span>
      <select id="sortOrderSelect" class="filter-select">
        <option value="latest">🕒 ใหม่ล่าสุด</option>
        <option value="distance">📍 ใกล้ที่สุด (เรียงตามระยะทาง)</option>
      </select>
      <button type="button" onclick="exportPostsBackup()" class="btn-gps" style="padding:4px 10px; font-size:12px; background:rgba(16,185,129,0.15); border-color:rgba(16,185,129,0.3); color:#10b981;">💾 สำรองข้อมูล</button>
      <label class="btn-gps" style="padding:4px 10px; font-size:12px; cursor:pointer; background:rgba(168,85,247,0.15); border-color:rgba(168,85,247,0.3); color:#c084fc;">
        📥 นำเข้าสำรอง
        <input type="file" accept=".json" style="display:none" onchange="handleImportBackup(event)">
      </label>
    </div>
  </div>

  <!-- รายการโพสต์ -->
  <div id="feedContainer"></div>
  <div id="feedEmpty" class="text-muted" style="text-align:center; display:none; padding:60px 0; font-size:15px;">
    ยังไม่มีโพสต์ในฟีด พิมพ์ข้อความด้านบนแล้วกด "โพสต์เลย" ได้เลยครับ! 🚀
  </div>

</div>

<!-- Leaflet.js (Free OpenStreetMap Library) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
