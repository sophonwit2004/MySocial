<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก - MADOO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-box">
  <div class="auth-brand">
    <h1>✨ MADOO</h1>
    <p>สมัครสมาชิกใหม่เข้าสู่ระบบ MADOO</p>
  </div>

  <div id="errorMsg" class="error-msg" style="display:none;"></div>

  <form id="registerForm">
    <div class="form-group">
      <label for="username">ชื่อผู้ใช้ (Username)</label>
      <input type="text" id="username" placeholder="username" required>
    </div>
    <div class="form-group">
      <label for="email">อีเมล</label>
      <input type="email" id="email" placeholder="example@email.com" required>
    </div>
    <div class="form-group">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" placeholder="••••••••" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-full">✨ สมัครสมาชิก</button>
  </form>

  <div class="divider"><span>หรือ</span></div>

  <button type="button" id="demoLoginBtn" class="btn btn-demo btn-full">
    🚀 เข้าสู่ระบบด่วน (บัญชีทดลอง 1-Click)
  </button>

  <div class="auth-switch">
    มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';

  try {
    const data = await apiRequest('/auth/register', 'POST', { username, email, password });
    saveAuth(data.token, data.user);
    window.location.href = 'profile.html';
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.style.display = 'block';
  }
});

document.getElementById('demoLoginBtn').addEventListener('click', async () => {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'block';
  errorMsg.style.color = 'var(--accent-cyan)';
  errorMsg.style.background = 'rgba(56, 189, 248, 0.12)';
  errorMsg.style.borderColor = 'rgba(56, 189, 248, 0.3)';
  errorMsg.textContent = '🚀 กำลังเข้าสู่ระบบทดลอง...';

  const demoEmail = 'demo@example.com';
  const demoPassword = 'password123';

  try {
    let data;
    try {
      data = await apiRequest('/auth/login', 'POST', { email: demoEmail, password: demoPassword });
    } catch (err) {
      data = await apiRequest('/auth/register', 'POST', { 
        username: 'DemoUser', 
        email: demoEmail, 
        password: demoPassword 
      });
    }
    saveAuth(data.token, data.user);
    window.location.href = 'profile.html';
  } catch (err) {
    errorMsg.style.color = 'var(--accent-pink)';
    errorMsg.textContent = err.message;
  }
});
</script>
</body>
</html>
