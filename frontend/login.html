<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook – เข้าสู่ระบบหรือสมัครใช้งาน</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="fb-login-wrapper">
  
  <div class="fb-login-left">
    <h1>facebook</h1>
    <p>ช่วยคุณเชื่อมต่อและแบ่งปันกับผู้คนมากมายรอบตัวคุณ</p>
  </div>

  <div class="auth-box">
    <div id="errorMsg" class="error-msg" style="display:none;"></div>
    <form id="loginForm">
      <input type="email" id="email" placeholder="อีเมลหรือหมายเลขโทรศัพท์" required>
      <input type="password" id="password" placeholder="รหัสผ่าน" required>
      <button type="submit" class="btn">เข้าสู่ระบบ</button>
    </form>

    <div style="text-align:center; margin:14px 0;">
      <a href="#" style="color:var(--fb-blue); font-size:14px; text-decoration:none;">ลืมรหัสผ่านใช่หรือไม่?</a>
    </div>

    <hr style="border:none; border-top:1px solid var(--fb-border); margin:16px 0;">

    <div>
      <button type="button" id="demoLoginBtn" class="btn btn-green">
        🚀 เข้าสู่ระบบด่วน (บัญชีทดลอง)
      </button>
    </div>

    <div class="auth-switch" style="margin-top:14px;">
      ยังไม่มีบัญชี? <a href="register.html">สร้างบัญชีใหม่</a>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';

  try {
    const data = await apiRequest('/auth/login', 'POST', { email, password });
    saveAuth(data.token, data.user);
    window.location.href = 'index.html';
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.style.display = 'block';
  }
});

document.getElementById('demoLoginBtn').addEventListener('click', async () => {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'block';
  errorMsg.style.color = 'var(--fb-blue)';
  errorMsg.textContent = '🚀 กำลังเข้าสู่ระบบทดลอง...';

  const demoEmail = 'demo@example.com';
  const demoPassword = 'password123';

  try {
    let data;
    try {
      data = await apiRequest('/auth/login', 'POST', { email: demoEmail, password: demoPassword });
    } catch (err) {
      data = await apiRequest('/auth/register', 'POST', { 
        username: 'DemoUser', 
        email: demoEmail, 
        password: demoPassword 
      });
    }
    saveAuth(data.token, data.user);
    window.location.href = 'index.html';
  } catch (err) {
    errorMsg.style.color = 'var(--fb-red)';
    errorMsg.textContent = err.message;
  }
});
</script>
</body>
</html>
