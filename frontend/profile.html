<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ - MADOO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <a href="index.html" class="nav-brand">✨ MADOO</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">🏠 ฟีด</a>
    <a href="search.html" class="nav-link">🔍 ค้นหา</a>
    <a href="profile.html" class="nav-link active">👤 โปรไฟล์</a>
    <button class="btn-logout" onclick="logout()">🚪 ออกจากระบบ</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="profile-header">
      <img id="profileAvatar" class="avatar" src="">
      <div>
        <h2 id="profileUsername" style="font-size:24px; font-weight:800; color:var(--text-main);"></h2>
        <p id="profileBio" class="text-muted" style="margin-top:4px; font-size:14px;"></p>
        <div class="follow-list">
          <span><strong id="followersCount">0</strong> ผู้ติดตาม</span>
          <span><strong id="followingCount">0</strong> กำลังติดตาม</span>
        </div>
      </div>
    </div>

    <div id="ownProfileActions" style="display:none; margin-top:18px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 16px;">
      <textarea id="bioInput" placeholder="เขียนเกี่ยวกับตัวคุณ..."></textarea>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
        <label class="file-label">
          📷 เปลี่ยนรูปโปรไฟล์
          <input type="file" id="profilePicInput" accept="image/*" style="display:none">
        </label>
        <button id="saveProfileBtn" class="btn btn-primary">💾 บันทึกโปรไฟล์</button>
      </div>
    </div>

    <button id="followBtn" class="follow-btn" style="display:none; margin-top:18px; width:100%;"></button>
  </div>

  <div id="userPosts"></div>

</div>

<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
